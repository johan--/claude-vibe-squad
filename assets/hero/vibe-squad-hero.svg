<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Squad: the path of one task</title>
  <desc id="desc">One operator talks to Chrono. Chrono writes a Markdown task file and routes it to one of 71 specialists, each bound to Codex, Claude, Gemini, or Grok. The task runs as a fresh native CLI in its own git worktree. Risky work is checked by a reviewer from a different model family. A Markdown result returns to Chrono.</desc>
  <style>
    /* Opaque paper, ink, secondary ink, rule, and a single rust accent.
       These same tokens apply on both light and dark README themes. */
    .paper { fill: #F6F5F1; }
    .ink { fill: #252823; }
    .secondary { fill: #5B6056; }
    .accent { fill: #993F29; }
    .rule { fill: none; stroke: #B9BCB2; stroke-width: 1.5; }
    .route { fill: none; stroke: #993F29; stroke-width: 2; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: Menlo, Consolas, monospace; }
    .small { font-size: 18px; }
    .label { font-size: 20px; }
    .name { font-size: 30px; font-weight: 600; }
  </style>
  <rect class="paper" width="1400" height="700"/>

  <!-- Editorial masthead, with no interface chrome or decorative icons. -->
  <text class="ink" x="64" y="103" font-family="Georgia, 'Times New Roman', serif" font-size="52">Vibe Squad</text>
  <text class="sans secondary" x="1336" y="100" text-anchor="end" font-size="24">Follow one task.</text>
  <path class="rule" d="M64 145H1336"/>

  <g class="mono secondary small">
    <text x="64" y="199">01 / REQUEST</text>
    <text x="520" y="199">02 / DISPATCH</text>
    <text x="850" y="199">03 / EXECUTE</text>
  </g>

  <!-- The outbound path. Arrowheads are plain paths, not filters. -->
  <g class="route">
    <path d="M218 305H278m-8-6 8 6-8 6"/>
    <path d="M438 305H510m-8-6 8 6-8 6"/>
    <path d="M755 305H840m-8-6 8 6-8 6"/>
  </g>
  <g class="sans ink">
    <text class="name" x="64" y="290">Operator</text>
    <text class="secondary label" x="64" y="327">One person</text>
    <text class="name" x="288" y="290">Chrono</text>
    <text class="secondary label" x="288" y="327">Coordinator</text>
  </g>

  <!-- A file, rather than a mock terminal. -->
  <path class="rule" d="M520 240H725L755 270V400H520ZM725 240V270H755"/>
  <text class="mono accent" x="544" y="293" font-size="27">task.md</text>
  <text class="sans secondary label" x="544" y="330">Markdown task</text>
  <path class="rule" d="M544 353H712M544 369H680"/>

  <!-- One execution enclosure, not four standing model leads. -->
  <rect class="rule" x="850" y="240" width="486" height="160"/>
  <g class="sans">
    <text class="ink name" x="874" y="282">One specialist</text>
    <text class="secondary label" x="874" y="316">1 of 71, bound to a model family</text>
    <text class="ink label" x="874" y="353">Codex / Claude / Gemini / Grok</text>
  </g>
  <path class="rule" d="M850 369H1336"/>
  <text class="mono secondary" x="874" y="391" font-size="19">Fresh native CLI · own git worktree</text>

  <!-- The return path. The dashed enclosure is explicitly conditional. -->
  <g class="route">
    <path d="M910 400V444H638V478m-6-8 6 8 6-8"/>
    <path d="M1160 400V478M850 534H765" stroke-dasharray="6 5"/>
    <path d="m1154 470 6 8 6-8M773 528l-8 6 8 6"/>
    <path d="M520 534H355V350m-6 8 6-8 6 8"/>
  </g>
  <rect class="rule" x="850" y="488" width="486" height="92" stroke-dasharray="6 5"/>
  <text class="sans ink" x="874" y="524" font-size="25" font-weight="600">Review if risky</text>
  <text class="sans secondary label" x="874" y="556">Reviewer from a different model family</text>
  <rect class="rule" x="520" y="488" width="235" height="92"/>
  <text class="mono accent" x="544" y="525" font-size="27">result.md</text>
  <text class="sans secondary label" x="544" y="557">Back to Chrono</text>

  <path class="rule" d="M64 632H1336"/>
  <text class="sans secondary label" x="64" y="667">Markdown files, all the way through.</text>
  <text class="mono secondary small" x="1336" y="667" text-anchor="end">REQUEST → TASK → RESULT</text>
</svg>
